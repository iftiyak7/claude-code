# Launch test: builds an x86_64 release APK, installs it on an Android
# emulator, opens the app and fails if it crashes. The logcat and a screenshot
# are uploaded so start-up crashes can be diagnosed without a phone.
name: Android launch test

on:
  push:
    branches: [main, claude/optimistic-galileo-y5dzn7]
    paths: ['mobile/**', '.github/workflows/android-smoke.yml']
  workflow_dispatch:

concurrency:
  group: android-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build x86_64 release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64

      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          working-directory: mobile
          script: bash ../.github/scripts/launch-check.sh android/app/build/outputs/apk/release/app-release.apk com.tadbeerdaily.app

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-test
          path: |
            mobile/logcat.txt
            mobile/screen.png
