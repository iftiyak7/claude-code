name: Android app

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Website the app opens'
        required: false
        default: 'https://goriberhisab.tech/app/'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed APK
        working-directory: android
        run: |
          URL="${{ github.event.inputs.app_url }}"
          gradle assembleRelease --no-daemon --stacktrace \
            -PappUrl="${URL:-https://goriberhisab.tech/app/}" \
            -PappVersionName="1.5.${{ github.run_number }}" \
            -PappVersionCode="$((10500 + ${{ github.run_number }}))"
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/goriber-hisab.apk
          ls -la ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: goriber-hisab-apk
          path: dist/goriber-hisab.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.5.${{ github.run_number }}
          name: Goriber Hisab Android 1.5.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Goriber Hisab Android app.
            Install: download goriber-hisab.apk on the phone, open it, allow "Install unknown apps" once.
          files: dist/goriber-hisab.apk
