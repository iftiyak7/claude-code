<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{title}} — Jashore360</title>
  <meta name="description" content="{{desc}}">
  <link rel="canonical" href="{{base}}{{path}}">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="Jashore360">
  <meta property="og:title" content="{{title}} — Jashore360">
  <meta property="og:description" content="{{desc}}">
  <meta property="og:url" content="{{base}}{{path}}">
  <meta property="og:image" content="{{base}}/shots/og.jpg">
  <meta name="theme-color" content="#f7f5ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@600;700;800&family=Hind+Siliguri:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/landing.css">
</head>
<body>
  <header class="nav">
    <div class="wrap">
      <a class="brand" href="/" aria-label="Jashore360"><svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="12" fill="#0e9f6e"/><path d="M20 32s-9-7.9-9-14.7a9 9 0 0 1 18 0C29 24.100 20 32 20 32z" fill="#fff"/><circle cx="20" cy="17" r="3.500" fill="#0e9f6e"/></svg>Jashore360</a>
      <div class="tools">{{switch}}<a class="btn sm" href="/app/">{{open}}</a></div>
    </div>
  </header>
  <main class="legal">
    <h1>{{title}}</h1>
    <p class="updated">{{updated}}</p>
    <nav class="tabs" aria-label="Jashore360"><a href="/terms{{q}}"{{terms_on}}>{{terms}}</a><a href="/privacy{{q}}"{{privacy_on}}>{{privacy}}</a></nav>
    {{body}}
  </main>
  <footer class="foot slim">
    <p class="copy">© {{year}} Jashore360 · <a href="/">{{home}}</a> · <a href="/terms{{q}}">{{terms}}</a> · <a href="/privacy{{q}}">{{privacy}}</a></p>
  </footer>
</body>
</html>
