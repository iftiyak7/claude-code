# Jashore360 — nginx site config (setup.sh fills in __SERVER_NAME__ and __ROOT__)
server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    root __ROOT__;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/manifest+json image/svg+xml application/json;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # File names aren't hashed, so browsers revalidate (cheap 304) instead of caching blindly.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # Never serve repo internals
    location ~ /\.(?!well-known) { deny all; }
    location ^~ /deploy/ { deny all; }
}
